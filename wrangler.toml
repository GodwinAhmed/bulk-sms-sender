# Cloudflare Pages project config.
# Secrets (CLERK_SECRET_KEY, DATABASE_URL, RESEND_API_KEY) are NOT stored here:
#   npx wrangler pages secret put <NAME>   (production)
#   .dev.vars                              (local dev)
name = "bulksms-sender"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public key from Clerk dashboard → API Keys (starts with pk_live_ or pk_test_)
CLERK_PUBLISHABLE_KEY = "pk_test_REPLACE_ME"
# Sender for report emails; the domain must be verified in Resend.
EMAIL_FROM = "BulkSMS Sender <reports@yourdomain.com>"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bulksms-sender-files"
